name: Daily listings refresh (07:00 IST)
on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect fresh listings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 scripts/collect.py
      - name: Commit updated listings
        run: |
          git config user.name "internship-finder-bot"
          git config user.email "bot@localhost"
          git add site/data/listings.json
          git diff --cached --quiet || git commit -m "Daily listings refresh"
          git push
